<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap" rel="stylesheet">
    <title>Projet Kepler</title>
    <link rel="stylesheet" href="style.css">
    <script src="p5/p5.min.js"></script>
    <link rel="shortcut icon" href="images/hole.png" type="image/x-icon">
</head>
    <body>
        <label>
            <input type="checkbox" id="menu">
            <div class="toggle">
                <span class="top_line common"></span>
                <span class="middle_line common"></span>
                <span class="bottom_line common"></span>
            </div>

            <div class="slide">
                <h1>Paramètre</h1>
                <ul>
                    <li>
                        <label for="method">Choisissez une méthode de calcul :</label>

                        <select name="method" id="method">
                            <option value="method_euler" selected="selected">Euler</option>
                            <option value="method_asymetric_euler">Euler asymétrique</option>
                            <option value="method_runge_kutta">Runger-Kutta</option>
                        </select>
                    </li>
                    <br>
                    <li>planètes affichés
                        <br>
                        <input type="checkbox" id="toggleMercury" checked>
                        <label for="toggle">Mercure</label> <br>
                        <input type="checkbox" id="toggleVenus" checked>
                        <label for="toggle">Venus</label> <br>
                        <input type="checkbox" id="toggleEarth" checked>
                        <label for="toggle">Terre</label> <br>
                        <input type="checkbox" id="toggleMars" checked>
                        <label for="toggle">Mars</label> <br>
                        <input type="checkbox" id="toggleJupiter" checked>
                        <label for="toggle">Jupiter</label> <br>
                        <input type="checkbox" id="toggleSaturn" checked>
                        <label for="toggle">Saturne</label> <br>
                        <input type="checkbox" id="toggleUranus" checked>
                        <label for="toggle">Uranus</label> <br>
                        <input type="checkbox" id="toggleNeptune" checked>
                        <label for="toggle">Neptune</label> <br>
                        <input type="checkbox" id="togglePluto" checked>
                        <label for="toggle">Pluton</label> <br>
                        <br>
                    </li>
                    <li>afficher la trajectoire
                        <br>
                        <input type="checkbox" id="toggleTrajectory" checked>
                    </li>
                </ul>
            </div>
        </label>

        <label>
            <div class="playpause"></div>
            <div class="reset">
                <img src="images/arrow.svg" alt="reset">
            </div>
            <div class="container">
                <input type="range" name="slider" id="slider" value="0" min="0" max="100">
            </div>
        </label>

        <h1 class="title">Projet Kepler</h1>
        <script type="text/javascript" src="script3D.js"></script>       
    </body>
</html>
